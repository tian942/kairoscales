<style>
/* ==========================================
   KAIRO — LIGHT-FIRST PALETTE
   White body, lime green accent, one bold
   dark "Reality" section for contrast.
   ========================================== */
:root {
  /* Core palette */
  --lime:        #C6F53A;   /* lime — fills, borders, button bg */
  --lime-dark:   #A4CB28;   /* hover state */
  --lime-deeper: #3D6800;   /* green text on white (WCAG AA) */
  --lime-tint:   #F1FADF;   /* very light section bg */
  --lime-tint2:  #E8F7C8;   /* slightly richer tint for cards */
  --lime-glow:   rgba(198,245,58,0.30);

  /* Neutrals */
  --bg:          #FFFFFF;
  --bg-soft:     #F7F7F5;   /* warm off-white, barely grey */
  --bg-ink:      #0A0A0A;   /* near-black for dark section */
  --navy:        #0C1220;   /* dark section bg */
  --text:        #111111;
  --text-mid:    #444444;
  --muted:       #888888;
  --border:      rgba(0,0,0,0.09);
  --border-lime: rgba(100,160,0,0.28);

  /* Type */
  --font-display: 'Anton', 'Arial Black', Impact, sans-serif;
  --font-script:  'Satisfy', 'Brush Script MT', cursive;
  --font-body:    'Poppins', system-ui, -apple-system, sans-serif;
  --font-mono:    'Space Mono', 'Courier New', monospace;

  /* Radius */
  --r-sm:   8px;
  --r-md:   12px;
  --r-lg:   16px;
  --r-xl:   22px;
  --r-pill: 999px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.68;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }

/* ---- Layout ---- */
.section    { padding: 80px 24px; }
.wrap       { max-width: 700px; margin: 0 auto; }
.wrap-wide  { max-width: 1080px; margin: 0 auto; }

/* ---- Type scale ---- */
h1 {
  font-family: var(--font-display);
  text-transform: uppercase;
  font-size: clamp(2.1rem, 5.5vw, 4rem);
  line-height: 0.93;
  font-weight: 400;
  letter-spacing: 0.01em;
  text-wrap: balance;
  color: var(--text);
}
h2 {
  font-family: var(--font-display);
  text-transform: uppercase;
  font-size: clamp(1.8rem, 4vw, 3rem);
  line-height: 1.0;
  font-weight: 400;
  letter-spacing: 0.01em;
  text-wrap: balance;
  margin-bottom: 28px;
  color: var(--text);
}
h3 {
  font-family: var(--font-display);
  text-transform: uppercase;
  font-size: 1.3rem;
  line-height: 1.05;
  font-weight: 400;
  margin-bottom: 12px;
  color: var(--text);
}
p { margin-bottom: 18px; color: var(--text-mid); }
p:last-child { margin-bottom: 0; }

/* Highlight on light bg: dark green, readable */
.hl { color: var(--lime-deeper); font-weight: 600; }
/* Highlight on dark bg: lime */
.on-dark .hl,
.hl-lime  { color: var(--lime); font-weight: 600; }

/* ---- Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-size: 0.83rem;
  font-weight: 700;
  padding: 16px 30px;
  border-radius: var(--r-pill);
  background: var(--lime);
  color: var(--bg-ink);
  border: none;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .2s ease, background .15s ease;
  white-space: nowrap;
}
.btn:hover {
  transform: translateY(-2px);
  background: var(--lime-dark);
  box-shadow: 0 8px 28px var(--lime-glow);
}
.btn:active { transform: translateY(0); }
.btn--lg { padding: 20px 44px; font-size: 0.9rem; }
.btn--outline {
  background: transparent;
  color: var(--lime-deeper);
  border: 1.5px solid var(--lime-deeper);
}
.btn--outline:hover {
  background: rgba(61,104,0,0.05);
  box-shadow: none;
}
/* Dark section button: lime on dark */
.btn--ondark {
  background: var(--lime);
  color: var(--bg-ink);
}
.btn--ondark:hover {
  background: var(--lime-dark);
  box-shadow: 0 8px 28px rgba(198,245,58,0.35);
}
/* Final CTA section button: dark on lime */
.btn--on-lime {
  background: var(--bg-ink);
  color: var(--lime);
  border: none;
}
.btn--on-lime:hover {
  background: #1a1a1a;
  box-shadow: 0 8px 28px rgba(0,0,0,0.3);
}

.btn-row { margin-top: 36px; }
.btn-row--center { text-align: center; }


/* ==========================================
   HEADER
   ========================================== */
.hdr {
  position: sticky;
  top: 0;
  z-index: 200;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--border);
  transition: height .2s ease;
}
.hdr.is-scrolled { height: 58px; }

/* Real Kairo logo: triangle + circle SVG + script name */
.logo {
  display: flex;
  align-items: center;
  gap: 11px;
}
.logo__svg {
  width: 38px;
  height: 34px;
  flex: none;
}
.logo__name {
  font-family: var(--font-script);
  font-size: 1.55rem;
  color: var(--text);
  line-height: 1;
  letter-spacing: -0.01em;
}

.hdr-nav {
  display: flex;
  align-items: center;
  gap: 36px;
}
.hdr-nav a {
  font-size: 0.9rem;
  color: var(--muted);
  transition: color .15s;
}
.hdr-nav a:hover { color: var(--text); }

.hdr .btn { padding: 11px 22px; font-size: 0.78rem; }


/* ==========================================
   BADGE
   ========================================== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--lime-deeper);
  border: 1px solid var(--border-lime);
  border-radius: var(--r-pill);
  padding: 9px 18px;
  background: rgba(198,245,58,0.12);
}
.badge__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--lime-deeper);
  animation: pulse-dot 2.4s ease infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.4; transform: scale(0.75); }
}


/* ==========================================
   HERO (white, bright)
   ========================================== */
.hero {
  padding: 20px 24px 56px;
  background: var(--bg);
  text-align: center;
  position: relative;
  overflow: hidden;
}
/* Subtle lime bloom top-right */
.hero::before {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 480px; height: 480px;
  background: radial-gradient(circle, rgba(198,245,58,0.22) 0%, transparent 70%);
  pointer-events: none;
}
.hero::after {
  content: '';
  position: absolute;
  bottom: -60px; left: -60px;
  width: 320px; height: 320px;
  background: radial-gradient(circle, rgba(198,245,58,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.hero__inner {
  position: relative;
  z-index: 2;
  max-width: 860px;
  margin: 0 auto;
}
.hero h1 { margin: 12px 0 16px; font-size: clamp(1.5rem, 4vw, 2.6rem); }
.hero h1 .g {
  color: var(--lime-deeper);
  display: block;
  margin-bottom: 6px;
}
.hero__sub {
  max-width: 580px;
  margin: 20px auto 0;
  font-size: 1.0625rem;
  color: var(--text-mid);
  line-height: 1.6;
}
.hero__sub .hl { color: var(--lime-deeper); }

/* Loom / VSL embed wrapper — sized to sit above the fold on load */
.vsl-wrap {
  max-width: 560px;
  margin: 0 auto;
  position: relative;
  padding-bottom: 56.25%; /* true 16:9 — kept correct so the video never looks squeezed; the max-width above is what keeps its actual pixel height compact */
  height: 0;
  border-radius: var(--r-xl);
  overflow: hidden;
  border: 1.5px solid var(--border-lime);
  box-shadow: 0 4px 40px rgba(0,0,0,0.10), 0 0 0 4px rgba(198,245,58,0.08);
}
.vsl-wrap iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: 0;
}


/* ==========================================
   SECTION SEAMS (light-mode)
   ========================================== */
.seam { border-top: 1px solid var(--border); }
.seam-lime { border-top: 2px solid rgba(198,245,58,0.45); }


/* ==========================================
   SECTION 2 — STILL FIGURING IT OUT
   ========================================== */
.sec-wonder { background: var(--bg); }

.quote-line {
  font-style: italic;
  color: var(--muted);
  font-size: 1.1rem;
  border-left: 3px solid var(--border-lime);
  padding-left: 18px;
  margin: 10px 0 22px;
}

.stack-list { list-style: none; margin: 8px 0 26px; }
.stack-list li {
  position: relative;
  padding-left: 26px;
  margin-bottom: 14px;
  font-size: 1.0625rem;
  color: var(--text-mid);
}
.stack-list li::before {
  content: '';
  position: absolute;
  left: 0; top: 13px;
  width: 11px; height: 2px;
  background: var(--lime-deeper);
}


/* ==========================================
   SECTION 3 — WHAT YOU ACTUALLY WANT
   ========================================== */
.sec-want {
  background: var(--lime-tint);
  position: relative;
  overflow: hidden;
}
.sec-want::before {
  content: '';
  position: absolute;
  top: -60px; right: -40px;
  width: 400px; height: 350px;
  background: radial-gradient(circle, rgba(198,245,58,0.30) 0%, transparent 65%);
  pointer-events: none;
}
.sec-want .wrap { position: relative; z-index: 2; }
.sec-want h2 { color: var(--text); }

.want-list { list-style: none; margin: 8px 0 26px; }
.want-list li {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 16px;
  line-height: 1.4;
  color: var(--text);
}
.want-list li .kw { color: var(--lime-deeper); }


/* ==========================================
   SECTION 4 — THE SKILL IS PORTABLE
   ========================================== */
.sec-skill { background: var(--bg-soft); }

.pullquote {
  border-left: 4px solid var(--lime-deeper);
  padding: 6px 0 6px 22px;
  margin: 30px 0;
  font-family: var(--font-display);
  text-transform: uppercase;
  font-size: clamp(1.35rem, 3vw, 2rem);
  line-height: 1.05;
  color: var(--text);
}

.callout-box {
  border: 1px solid var(--border-lime);
  border-radius: var(--r-md);
  background: rgba(198,245,58,0.10);
  padding: 22px 26px;
  font-size: 1.0625rem;
  color: var(--text-mid);
  line-height: 1.65;
}
.callout-box .hl { color: var(--lime-deeper); }


/* ==========================================
   SECTION 5 — WHAT YOU GET (CARDS)
   ========================================== */
.sec-get { background: var(--bg); }

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin-top: 8px;
}
.card-full { grid-column: 1 / -1; }

.card {
  background: var(--bg);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  border-top: 3px solid var(--lime-deeper);
  padding: 26px;
  /* subtle shadow */
  box-shadow: 0 1px 6px rgba(0,0,0,0.05), 0 3px 16px rgba(0,0,0,0.03);
}
.card h3 { color: var(--text); }
.card p {
  font-size: 1rem;
  color: var(--text-mid);
  line-height: 1.62;
}
.card .hl { color: var(--lime-deeper); }
.card p:last-child { margin-bottom: 0; }


/* ==========================================
   SECTION 6 — THE REALITY (stays dark)
   ========================================== */
.sec-reality {
  background: var(--navy);
  color: #E8E8E8;
  position: relative;
  overflow: hidden;
}
.sec-reality::before {
  content: '';
  position: absolute;
  top: -60px; left: 50%;
  transform: translateX(-50%);
  width: 700px; height: 500px;
  background: radial-gradient(ellipse, rgba(198,245,58,0.08) 0%, transparent 65%);
  pointer-events: none;
}
/* Override text color for dark section */
.sec-reality h2 { color: #F0F0F0; }
.sec-reality p  { color: #C8C8C8; }
.sec-reality .wrap { position: relative; z-index: 2; }

.payoff-box {
  border: 1px solid rgba(198,245,58,0.25);
  border-radius: var(--r-md);
  background: rgba(198,245,58,0.05);
  padding: 26px 28px;
  margin: 28px 0;
  font-size: 1.0625rem;
  color: #D0D0D0;
}
.payoff-box strong { color: var(--lime); font-weight: 600; }

.closing-line {
  color: var(--lime);
  font-weight: 600;
  font-size: 1.175rem;
  line-height: 1.55;
}


/* ==========================================
   SECTION 7 — THE ROLE
   ========================================== */
.sec-role { background: var(--bg-soft); }

.role-card {
  max-width: 500px;
  margin: 0 auto;
  background: var(--bg);
  border: 1.5px solid var(--border-lime);
  border-radius: var(--r-xl);
  box-shadow: 0 4px 32px rgba(0,0,0,0.07), 0 0 0 6px rgba(198,245,58,0.07);
  padding: 44px;
  text-align: center;
}
.role-card__eyebrow {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--lime-deeper);
  margin-bottom: 6px;
}
.role-card h2 {
  font-size: 2.2rem;
  margin-bottom: 4px;
}
.role-card__sub {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--muted);
  margin-bottom: 30px;
}

.specs-list { list-style: none; text-align: left; margin-bottom: 24px; }
.specs-list li {
  position: relative;
  padding-left: 24px;
  margin-bottom: 14px;
  font-size: 1.0625rem;
  color: var(--text-mid);
}
.specs-list li::before {
  content: '';
  position: absolute;
  left: 0; top: 12px;
  width: 10px; height: 2px;
  background: var(--lime-deeper);
}
.specs-list .hl { color: var(--lime-deeper); }

.role-card__note {
  color: var(--muted);
  font-size: 0.95rem;
  text-align: left;
  margin-bottom: 28px;
  line-height: 1.65;
}


/* ==========================================
   FINAL CTA (lime background)
   ========================================== */
.sec-final {
  background: var(--lime);
  text-align: center;
  padding: 88px 24px;
}
.sec-final h2 {
  color: var(--bg-ink);
  margin-bottom: 16px;
}
.sec-final p {
  color: #2a2a2a;
  max-width: 460px;
  margin: 0 auto 32px;
  font-weight: 600;
  font-size: 1.1rem;
}


/* ==========================================
   FOOTER
   ========================================== */
.footer {
  background: var(--bg-ink);
  border-top: none;
  padding: 28px 24px;
}
.footer__row {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
/* Logo on dark footer: white text, white SVG strokes */
.footer .logo__name { color: #f0f0f0; }
.footer .logo__svg path,
.footer .logo__svg circle { stroke: #f0f0f0; }
.footer__copy {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: #666;
}


/* ==========================================
   RESPONSIVE
   ========================================== */
@media (max-width: 900px) { .hdr-nav { display: none; } }
@media (max-width: 680px) {
  .section { padding: 56px 20px; }
  .cards { grid-template-columns: 1fr; }
  .card-full { grid-column: 1; }
  .role-card { padding: 32px 22px; }
  .hero { padding: 16px 20px 40px; }
  .hero h1 { font-size: clamp(1.3rem, 6vw, 1.7rem); margin: 10px 0 14px; }
  .badge { padding: 7px 14px; font-size: 0.62rem; }
  .hdr { height: 56px; padding: 0 16px; }
}
@media (max-width: 380px) {
  .hdr { padding: 0 12px; }
  .logo { gap: 7px; }
  .logo__svg { width: 30px; height: 27px; }
  .logo__name { font-size: 1.25rem; }
  .hdr .btn { padding: 9px 14px; font-size: 0.68rem; }
}
@media (prefers-reduced-motion: reduce) {
  .badge__dot { animation: none; }
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="hdr" id="hdr">
  <a href="https://kairoscales.com/salescareers/" class="logo" aria-label="Kairo homepage">
    <svg class="logo__svg" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M50 4 L97 86 H3 Z" stroke="#111" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="50" cy="65" r="22" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span class="logo__name">Kairo</span>
  </a>
</header>

<main id="top">

<!-- ============ THANK YOU ============ -->
<section class="hero" style="min-height: 70vh; display: flex; align-items: center;">
  <div class="hero__inner">
    <span class="badge"><span class="badge__dot" aria-hidden="true"></span>Application Received</span>
    <h1 style="margin-top: 20px;">Thank You</h1>
    <p class="hero__sub" style="font-size: 1.15rem; max-width: 520px;">
      Your application has been submitted successfully.
    </p>
    <p class="hero__sub" style="max-width: 520px;">
      You do not need to do anything — just keep an eye on your email inbox.
    </p>
    <p class="hero__sub" style="max-width: 520px;">
      If your application is successful, we'll be in touch within the next 24 hours with the next steps.
    </p>
    <p class="hero__sub hl" style="max-width: 520px; font-weight: 600;">
      Good luck.
    </p>
  </div>
</section>

</main>

<!-- ============ FOOTER ============ -->
<footer class="footer">
  <div class="footer__row">
    <a href="https://kairoscales.com/salescareers/" class="logo" aria-label="Back to Kairo">
      <svg class="logo__svg" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M50 4 L97 86 H3 Z" stroke="#f0f0f0" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="50" cy="65" r="22" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span class="logo__name" style="color:#f0f0f0">Kairo</span>
    </a>
    <span class="footer__copy">© Kairo Marketing</span>
  </div>
</footer>

<script>
  const hdr = document.getElementById('hdr');
  window.addEventListener('scroll', () => {
    hdr.classList.toggle('is-scrolled', window.scrollY > 56);
  }, { passive: true });
</script>
</body>
</html>
