<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Application Received — Kairo</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/kairo-glass.css">
<style>
.received-main {min-height:100svh;display:grid;place-items:center;padding:32px 20px;}
.received-panel {max-width:800px;width:100%;text-align:center;display:grid;gap:28px;justify-items:center;padding:clamp(32px,6vw,64px);}
.received-panel h1 {font-size:clamp(2.2rem,6vw,4.2rem);}
.received-panel .kg-lede {margin:0;}
</style>
</head>
<body class="kg" data-kg-auto>
<div class="kg-ambient" aria-hidden="true"></div>
<div class="kg-page"><main class="received-main">
<section class="kg-panel kg-panel-lime received-panel" aria-labelledby="received-title">
<div class="kg-brand"><img src="/images/logo-mark.png" alt="" width="38" height="38"><span class="kg-brand-text"><span class="kg-brand-name">KAIRO</span><span class="kg-brand-sub">MARKETING</span></span></div>
<h1 id="received-title" class="kg-display">Application received.</h1>
<p class="kg-lede">Thank you for applying. We'll be in touch soon.</p>
</section>
</main></div>
<script src="/kairo-glass.js"></script>
</body>
</html>
